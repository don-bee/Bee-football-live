<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bee Football Live & Sports Hub</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #121829;
      --accent: #22c55e;
      --accent-yellow: #eab308;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 120px; }
    
    header { background: #0e1424; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 18px; font-weight: 800; color: var(--accent-yellow); display: flex; align-items: center; gap: 6px; }
    .user-badge { background: var(--card); border: 1px solid var(--border); padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; color: var(--accent); cursor: pointer; }
    
    .banner-scroll { display: flex; gap: 10px; padding: 12px 15px; overflow-x: auto; scrollbar-width: none; }
    .banner-scroll::-webkit-scrollbar { display: none; }
    .banner-item { min-width: 100px; height: 70px; background: linear-gradient(135deg, #1e1b4b, #312e81); border-radius: 12px; border: 1px solid #3730a3; padding: 8px; display: flex; flex-direction: column; justify-content: flex-end; font-size: 11px; font-weight: bold; color: #fff; flex-shrink: 0; }

    .filters { display: flex; gap: 8px; padding: 0 15px 10px; overflow-x: auto; scrollbar-width: none; }
    .filter-chip { background: var(--card); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; cursor: pointer; }
    .filter-chip.active { background: var(--accent); color: #000; font-weight: bold; }

    .nav-tabs { display: flex; background: #0e1424; border-y: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 12px 5px; background: none; border: none; color: var(--muted); font-size: 12px; font-weight: bold; cursor: pointer; text-align: center; }
    .tab-btn.active { color: var(--accent-yellow); border-bottom: 2px solid var(--accent-yellow); }

    .container { padding: 15px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .match-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .match-header { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 12px; font-weight: 600; }
    .badge-live { background: #ef4444; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; }
    .badge-ft { background: #334155; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
    
    .teams-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
    .team-col { display: flex; flex-direction: column; align-items: center; flex: 1; text-align: center; }
    .team-crest { width: 32px; height: 32px; margin-bottom: 4px; object-fit: contain; }
    .team-name { font-size: 12px; font-weight: bold; }
    .vs-col { font-size: 15px; font-weight: 800; color: var(--accent-yellow); text-align: center; min-width: 50px; }

    /* SportyBet Odds Buttons */
    .odds-row { display: flex; gap: 8px; margin-top: 10px; }
    .odds-btn { flex: 1; background: #1a2238; border: 1px solid var(--border); border-radius: 8px; padding: 8px 4px; text-align: center; cursor: pointer; color: var(--text); font-size: 11px; }
    .odds-btn:active, .odds-btn.selected { background: var(--accent-yellow); color: #000; font-weight: bold; }
    .odds-title { font-size: 9px; color: var(--muted); display: block; margin-bottom: 2px; }

    /* Booking Code Box */
    .booking-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 15px; display: flex; gap: 8px; }
    .booking-input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: #090d16; color: #fff; font-size: 12px; text-transform: uppercase; }

    /* BetSlip Floating Bar */
    .betslip-bar { position: fixed; bottom: 50px; left: 0; width: 100%; background: #166534; color: #fff; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: bold; z-index: 150; cursor: pointer; }

    /* Bottom App Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #0e1424; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 200; }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--muted); text-decoration: none; cursor: pointer; }
    .nav-item.active { color: var(--accent-yellow); font-weight: bold; }

    textarea, input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #090d16; color: #fff; box-sizing: border-box; margin-bottom: 8px; font-size: 12px; }
    .btn { background: var(--accent-yellow); color: #000; border: none; padding: 10px 15px; font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🐝 Bee Football Live</div>
    <div class="user-badge" id="user-display" onclick="openProfile()">👤 Log In</div>
  </header>

  <div class="banner-scroll">
    <div class="banner-item" style="background: linear-gradient(135deg, #1e1b4b, #4338ca);">🔥 Top Matches</div>
    <div class="banner-item" style="background: linear-gradient(135deg, #064e3b, #047857);">💰 Free Play ₦10,000</div>
    <div class="banner-item" style="background: linear-gradient(135deg, #701a75, #a21caf);">⚡ Booking Codes</div>
  </div>

  <div class="container" style="padding-bottom:0;">
    <div class="booking-box">
      <input type="text" id="booking-code-input" class="booking-input" placeholder="Paste Booking Code (e.g. BEE-92)">
      <button class="btn" style="width:auto; padding:8px 12px;" onclick="loadBookingCode()">Load</button>
    </div>
  </div>

  <div class="filters">
    <div class="filter-chip active" onclick="loadLeague('eng.1', this)">⚽ Premier League</div>
    <div class="filter-chip" onclick="loadLeague('esp.1', this)">🇪🇸 La Liga</div>
    <div class="filter-chip" onclick="loadLeague('ger.1', this)">🇩🇪 Bundesliga</div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('scores')">⚽ Matches & Odds</button>
    <button class="tab-btn" onclick="switchTab('news')">📰 News</button>
    <button class="tab-btn" onclick="switchTab('profile')">👤 My Account</button>
  </div>

  <div class="container">
    
    <!-- Matches Tab -->
    <div id="scores" class="tab-content active">
      <div id="matches-list">Loading live odds center...</div>
    </div>

    <!-- News Tab -->
    <div id="news" class="tab-content">
      <div id="news-list">Loading headlines...</div>
    </div>

    <!-- Account / Profile Tab -->
    <div id="profile" class="tab-content">
      <div class="match-card">
        <h3>User Profile & Account</h3>
        <p style="font-size:12px; color:var(--muted);">Virtual Balance: <b style="color:var(--accent); font-size:14px;" id="balance-display">₦10,000.00</b></p>
        <input type="text" id="profile-name" placeholder="Enter Fan Username">
        <button class="btn" onclick="saveProfile()">Save Profile</button>
      </div>
    </div>

  </div>

  <!-- BetSlip Bar -->
  <div id="betslip-bar" class="betslip-bar" onclick="placeVirtualBet()" style="display:none;">
    <span id="betslip-count">BetSlip (0 Selections)</span>
    <span>Place Virtual Bet ₦1,000 &rarr;</span>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('scores')"><div>⚽</div><div>Sports</div></div>
    <div class="nav-item" onclick="switchTab('news')"><div>📰</div><div>News</div></div>
    <div class="nav-item" onclick="switchTab('profile')"><div>👤</div><div>Account</div></div>
  </div>

  <script>
    let currentLeague = 'eng.1';
    let betSelections = [];
    let userBalance = 10000;

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if (tabId === 'news') fetchNews();
    }

    function loadLeague(leagueCode, element) {
      document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      currentLeague = leagueCode;
      fetchLiveScores();
    }

    async function fetchLiveScores() {
      const listContainer = document.getElementById('matches-list');
      try {
        const response = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${currentLeague}/scoreboard`);
        const data = await response.json();

        if (!data.events || data.events.length === 0) {
          listContainer.innerHTML = '<div class="match-card">No fixtures available today.</div>';
          return;
        }

        listContainer.innerHTML = data.events.map(event => {
          const compName = data.leagues[0].name;
          const status = event.status.type.state === 'in' ? `<span class="badge-live">LIVE</span>` : `<span class="badge-ft">${event.status.type.shortDetail}</span>`;
          
          const home = event.competitions[0].competitors[0];
          const away = event.competitions[0].competitors[1];

          return `
            <div class="match-card">
              <div class="match-header"><span>${compName}</span>${status}</div>
              <div class="teams-row">
                <div class="team-col">
                  ${home.team.logo ? `<img src="${home.team.logo}" class="team-crest">` : ''}
                  <span class="team-name">${home.team.shortDisplayName || home.team.name}</span>
                </div>
                <div class="vs-col">${home.score || 0} - ${away.score || 0}</div>
                <div class="team-col">
                  ${away.team.logo ? `<img src="${away.team.logo}" class="team-crest">` : ''}
                  <span class="team-name">${away.team.shortDisplayName || away.team.name}</span>
                </div>
              </div>
              <div class="odds-row">
                <div class="odds-btn" onclick="toggleBet('${home.team.name} Win', 1.85, this)"><span class="odds-title">1</span>1.85</div>
                <div class="odds-btn" onclick="toggleBet('Draw', 3.40, this)"><span class="odds-title">X</span>3.40</div>
                <div class="odds-btn" onclick="toggleBet('${away.team.name} Win', 4.20, this)"><span class="odds-title">2</span>4.20</div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        listContainer.innerHTML = '<div class="match-card">Unable to load odds right now.</div>';
      }
    }

    function toggleBet(selection, odds, element) {
      element.classList.toggle('selected');
      const idx = betSelections.findIndex(b => b.selection === selection);
      if (idx > -1) {
        betSelections.splice(idx, 1);
      } else {
        betSelections.push({ selection, odds });
      }

      const bar = document.getElementById('betslip-bar');
      if (betSelections.length > 0) {
        bar.style.display = 'flex';
        document.getElementById('betslip-count').innerText = `BetSlip (${betSelections.length} Selections)`;
      } else {
        bar.style.display = 'none';
      }
    }

    function placeVirtualBet() {
      if (userBalance < 1000) {
        alert("Insufficient virtual balance!");
        return;
      }
      userBalance -= 1000;
      document.getElementById('balance-display').innerText = `₦${userBalance.toLocaleString()}.00`;
      const randomCode = 'BEE-' + Math.floor(100 + Math.random() * 900);
      alert(`Virtual Bet Placed Successfully!\nBooking Code: ${randomCode}\nRemaining Balance: ₦${userBalance.toLocaleString()}`);
      betSelections = [];
      document.getElementById('betslip-bar').style.display = 'none';
      document.querySelectorAll('.odds-btn').forEach(b => b.classList.remove('selected'));
    }

    function saveProfile() {
      const name = document.getElementById('profile-name').value;
      if (name) {
        document.getElementById('user-display').innerText = '👤 ' + name;
        alert("Profile saved successfully!");
      }
    }

    function loadBookingCode() {
      const code = document.getElementById('booking-code-input').value;
      if (code) {
        alert(`Loaded Booking Code: ${code.toUpperCase()}\n2 Selections added to BetSlip!`);
        betSelections = [{ selection: 'Home Win', odds: 1.85 }, { selection: 'Over 2.5 Goals', odds: 1.65 }];
        document.getElementById('betslip-bar').style.display = 'flex';
        document.getElementById('betslip-count').innerText = `BetSlip (2 Selections)`;
      }
    }

    async function fetchNews() {
      const newsContainer = document.getElementById('news-list');
      try {
        const response = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${currentLeague}/news`);
        const data = await response.json();
        newsContainer.innerHTML = data.articles.map(art => `
          <div class="match-card">
            <b style="font-size:13px;">${art.headline}</b>
            <p style="font-size:11px; color:var(--muted); margin:4px 0 0 0;">${art.description || ''}</p>
          </div>
        `).join('');
      } catch (e) {
        newsContainer.innerHTML = '<div class="match-card">Unable to fetch news.</div>';
      }
    }

    fetchLiveScores();
  </script>
</body>
</html>
